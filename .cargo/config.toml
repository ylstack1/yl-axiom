[alias]
xtask = "run --package parchment-xtask --"

[build]
# Keep parallel compilation within 7.7 GB host RAM to avoid pagefile thrashing.
jobs = 4

[registry]
# Rust 1.100 dependency cooldown: ignore newly published crates during `cargo update`
# while keeping locked CI and offline builds reproducible from Cargo.lock.
global-min-publish-age = "3 days"

[target.aarch64-linux-android]
rustflags = [
    "-C", "force-unwind-tables=no",
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--icf=safe",
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
]
