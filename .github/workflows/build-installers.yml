name: Build Android APK & Windows EXE Installer

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "release-please-config.json"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "CHANGELOG.md"
      - "release-please-config.json"
  workflow_dispatch:
    inputs:
      reuse_android_run:
        description: "Windows only: ID of the run whose APK to reuse. The release keeps that run's version. Leave empty for a full build."
        required: false
        default: ""

permissions:
  contents: read

cache-mode: read

# Cancel superseded branch and PR builds immediately, while never cancelling version-tag or manual release runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'ci' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}

# Branch builds are <manifest major.minor>.<run number - VERSION_BASE_RUN>: run 73 is 3.0.0, etc.
# Earlier runs keep 2.0.<run number>, so a Windows-only rebuild reusing one still matches its APK.
# The Android version code stays 200 + run number, so it only ever grows.
env:
  VERSION_BASE_RUN: "73"
jobs:
  preflight:
    name: Preflight Gates & Path Filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    cache-mode: none
    permissions:
      contents: read
      actions: read
    outputs:
      build_number: ${{ steps.plan.outputs.build_number }}
      app_version: ${{ steps.plan.outputs.app_version }}
      app_version_code: ${{ steps.plan.outputs.app_version_code }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      rust_core: ${{ steps.plan.outputs.rust_core }}
      rust_windows: ${{ steps.plan.outputs.rust_windows }}
      desktop_tests: ${{ steps.plan.outputs.desktop_tests }}
      windows_tests: ${{ steps.plan.outputs.windows_tests }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt

      - name: Run Quality Gates, xtask Tests, and Resolve Affected Jobs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          REUSE_ANDROID_RUN: ${{ inputs.reuse_android_run }}
        run: |
          set -euo pipefail
          cargo test -p parchment-xtask
          cargo xtask review
          cargo xtask ci plan installers

      - name: Upload Prebuilt xtask Binary for Linux Gradle Jobs
        if: steps.plan.outputs.desktop_tests == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parchment-xtask-linux
          path: target/debug/parchment-xtask
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  rust-core-check:
    name: Rust Core (clippy, tests)
    needs: preflight
    if: needs.preflight.outputs.rust_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    cache-mode: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-core
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Verify Rust Clippy and Tests
        run: |
          set -euo pipefail
          cargo clippy --workspace --exclude parchment-desktop --all-targets -- -D warnings
          cargo clippy -p parchment-core --no-default-features --features android-jni -- -D warnings
          cargo test --workspace --exclude parchment-desktop
          cargo test -p parchment-core --no-default-features --features android-jni

  test-desktop:
    name: Kotlin Tests & Lint (Shard ${{ matrix.label }})
    needs: preflight
    if: needs.preflight.outputs.desktop_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    cache-mode: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - shard: 0
            label: "1/2"
          - shard: 1
            label: "2/2"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Download Prebuilt xtask Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parchment-xtask-linux
          path: ${{ runner.temp }}/xtask

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Kotlin Lint and Test Shard
        run: |
          set -euo pipefail
          chmod +x ./gradlew "$RUNNER_TEMP/xtask/parchment-xtask"
          read -r -a SHARD_ARGS <<< "$("$RUNNER_TEMP/xtask/parchment-xtask" ci shard-tests --index "${{ matrix.shard }}" --total 2 --lead-overhead 80000)"
          GRADLE_TASKS=(:composeApp:desktopTest)
          if [[ "${{ matrix.shard }}" == "0" ]]; then
            GRADLE_TASKS=(ktlintCheck :composeApp:desktopTest)
          fi
          "$RUNNER_TEMP/xtask/parchment-xtask" ci run-gradle -- "${GRADLE_TASKS[@]}" "${SHARD_ARGS[@]}" \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pparchment.testForks=3 \
            --no-daemon --no-configuration-cache --max-workers=4 \
            -Pkotlin.compiler.execution.strategy=in-process

  test-windows-native:
    name: Windows Native Kotlin Tests
    needs: preflight
    if: needs.preflight.outputs.windows_tests == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    cache-mode: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Windows Native Test Suites
        shell: pwsh
        run: |
          $winTests = (cargo xtask ci shard-tests --windows-native) -split ' '
          cargo xtask ci run-gradle -- :composeApp:desktopTest @winTests `
            '-Dorg.gradle.jvmargs=-Xmx5g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' `
            '-Pparchment.testForks=2' `
            --no-daemon --no-configuration-cache --max-workers=4 '-Pkotlin.compiler.execution.strategy=in-process'
          exit $LASTEXITCODE

  build-android-apk:
    name: Build Android .APK (arm64-v8a + Rust JNI)
    needs: preflight
    if: needs.preflight.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    cache-mode: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Set up Rust Toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust Dependencies (Android)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-android
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
      - name: Restore cargo-ndk Binary Cache
        id: cache-cargo-ndk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-ndk if Missing
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Save cargo-ndk Cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2-${{ runner.os }}-${{ runner.arch }}

      - name: Build Slim 16 KB-Aligned Rust JNI Core (arm64-v8a)
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          test -d "$ANDROID_NDK_HOME"
          cargo xtask android-so

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Restore Android Platform 37 Cache
        id: cache-android-platform
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/platforms/android-37*
          key: android-platform-37-v3-${{ runner.os }}

      - name: Restore Android Build-Tools 37 Cache
        id: cache-android-bt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/build-tools/37*
          key: android-build-tools-37-v3-${{ runner.os }}

      - name: Write Android SDK License Hashes
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Stage Private Release Signer
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cargo xtask ci stage-signing

      - name: Build Android APK
        env:
          APP_VER: ${{ needs.preflight.outputs.app_version }}
          APP_CODE: ${{ needs.preflight.outputs.app_version_code }}
          DESKTOP_TESTS_RAN: ${{ needs.preflight.outputs.desktop_tests }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            BUILD_VARIANT=debug
            BUILD_TASK=:androidApp:assembleDebug
            EXTRA_FLAGS=(-PofficialRelease=false)
          else
            BUILD_VARIANT=release
            BUILD_TASK=:androidApp:assembleRelease
            EXTRA_FLAGS=(-PofficialRelease=true -x :androidApp:lintVitalRelease)
          fi
          GRADLE_TASKS=("$BUILD_TASK")
          if [[ "$DESKTOP_TESTS_RAN" != "true" ]]; then
            GRADLE_TASKS=(ktlintCheck "$BUILD_TASK")
          fi
          echo "ANDROID_BUILD_VARIANT=$BUILD_VARIANT" >> "$GITHUB_ENV"
          chmod +x ./gradlew
          cargo xtask ci run-gradle -- "${GRADLE_TASKS[@]}" \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -PappVersion="$APP_VER" \
            -PappVersionCode="$APP_CODE" \
            -PgithubRepo="$GITHUB_REPOSITORY" \
            "${EXTRA_FLAGS[@]}" \
            --no-daemon --no-configuration-cache --max-workers=4 -Pkotlin.compiler.execution.strategy=in-process
      - name: Rename APK and Verify Budget & Bundled JNI
        run: |
          set -euo pipefail
          mkdir -p dist
          cp mobile/android-app/build/outputs/apk/"$ANDROID_BUILD_VARIANT"/*.apk dist/Parchment-Android-Universal.apk
          if [[ "$ANDROID_BUILD_VARIANT" == release ]]; then
            cp mobile/android-app/build/outputs/mapping/release/mapping.txt dist/Parchment-Android-R8-mapping.txt
            SIZE=$(stat -c%s dist/Parchment-Android-Universal.apk)
            test "$SIZE" -le 7864320
          fi
          test -s dist/Parchment-Android-Universal.apk
          unzip -l dist/Parchment-Android-Universal.apk | grep -q 'lib/arm64-v8a/libparchment_core.so'

      - name: Save Android Platform 37 Cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache-android-platform.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/platforms/android-37*
          key: android-platform-37-v3-${{ runner.os }}

      - name: Save Android Build-Tools 37 Cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache-android-bt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/build-tools/37*
          key: android-build-tools-37-v3-${{ runner.os }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Parchment-Android-APK
          path: dist/Parchment-*
          compression-level: 1
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          if-no-files-found: error

      - name: Remove Staged Private Signer
        if: always() && github.event_name != 'pull_request'
        run: |
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            dir=$(dirname "$ANDROID_KEYSTORE_PATH")
            case "$dir" in
              "$RUNNER_TEMP"/parchment-signing-*)
                rm -f "$ANDROID_KEYSTORE_PATH"
                rmdir "$dir" 2>/dev/null || true
                ;;
              *)
                echo "Unexpected signer staging directory: $dir" >&2
                exit 1
                ;;
            esac
          fi

  build-windows-exe:
    name: Build Windows .EXE Installer (Native Rust + GPUI)
    needs: preflight
    if: needs.preflight.outputs.rust_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    cache-mode: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - name: Cache Rust Dependencies (Windows)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Verify Windows Desktop Crate and Build Release GPUI .EXE
        shell: pwsh
        env:
          AWS_LC_SYS_PREBUILT_NASM: "1"
          PARCHMENT_APP_VERSION: ${{ needs.preflight.outputs.app_version }}
        run: |
          if (-not $env:GPUI_FXC_PATH) {
            $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($fxc) { $env:GPUI_FXC_PATH = $fxc.FullName }
          }
          cargo build --release -p parchment-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p parchment-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --release -p parchment-desktop --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item "target\release\parchment-desktop.exe" -ErrorAction Stop
          $mb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Built parchment-desktop.exe: $mb MB"
          if ($exe.Length -gt 36700160) { throw "parchment-desktop.exe ($mb MB) exceeds 35 MB budget" }

      - name: Package Minimal Zero-Trace .EXE Installer with Inno Setup
        shell: pwsh
        env:
          APP_VER: ${{ needs.preflight.outputs.app_version }}
          INNO_COMPRESSION: ${{ github.event_name == 'pull_request' && 'lzma2/fast' || 'lzma2/max' }}
        run: iscc.exe "/DMyAppVersion=$env:APP_VER" "/DMyCompression=$env:INNO_COMPRESSION" installer\windows-installer.iss

      - name: Verify Silent Inno Setup Install Lands Standalone Parchment.exe
        shell: pwsh
        env:
          APP_VER: ${{ needs.preflight.outputs.app_version }}
        run: |
          $testDir = Join-Path ([System.IO.Path]::GetTempPath()) "parchment-inno-smoke"
          Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          try {
            $proc = Start-Process -FilePath "build\installer\Parchment-Windows-x64-Setup.exe" `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$testDir" `
              -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Silent installer exited with $($proc.ExitCode)" }
            $installed = Get-Item "$testDir\Parchment.exe" -ErrorAction Stop
            if ($installed.Length -lt 1048576) { throw "Installed Parchment.exe is unexpectedly small: $($installed.Length) B" }
            $prodVer = $installed.VersionInfo.ProductVersion
            if ($prodVer -ne $env:APP_VER) {
              throw "Installed Parchment.exe ProductVersion '$prodVer' != expected '$($env:APP_VER)'"
            }
            Add-Type -Namespace Win32Check -Name Native -MemberDefinition '[DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern uint ExtractIconExW(string lpszFile, int nIconIndex, IntPtr[] phiconLarge, IntPtr[] phiconSmall, uint nIcons);'
            $iconCount = [Win32Check.Native]::ExtractIconExW($installed.FullName, -1, $null, $null, 0)
            if ($iconCount -lt 1) {
              throw "Installed Parchment.exe has no embedded Win32 icon resource (ExtractIconExW=$iconCount)"
            }
          } finally {
            Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          }
      - name: Upload Windows EXE Installer Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Parchment-Windows-EXE-Installer
          path: build/installer/Parchment-Windows-x64-Setup.exe
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          if-no-files-found: error

  release-sbom:
    name: Generate Release SBOM
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Download Prebuilt xtask Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parchment-xtask-linux
          path: ${{ runner.temp }}/xtask

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Restore Android Platform 37 Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/platforms/android-37*
          key: android-platform-37-v3-${{ runner.os }}

      - name: Write Android SDK License Hashes
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Generate and Validate SBOM
        run: |
          set -euo pipefail
          chmod +x ./gradlew "$RUNNER_TEMP/xtask/parchment-xtask"
          "$RUNNER_TEMP/xtask/parchment-xtask" ci run-gradle -- --init-script .github/scripts/sbom.init.gradle.kts cyclonedxBom \
            --no-daemon --no-configuration-cache --no-build-cache --max-workers=4 -PappVersion=1.0.0
          "$RUNNER_TEMP/xtask/parchment-xtask" ci check-sbom build/reports/cyclonedx/bom.json
          mkdir -p dist
          cp build/reports/cyclonedx/bom.json dist/Parchment-SBOM.cdx.json
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Parchment-SBOM
          path: dist/Parchment-SBOM.cdx.json
          compression-level: 1
          retention-days: 30
          if-no-files-found: error

  publish-github-release:
    name: Publish OTA Release Assets (.APK & .EXE)
    needs: [preflight, rust-core-check, test-desktop, test-windows-native, build-android-apk, build-windows-exe, release-sbom]
    # Releases come only from version tags (release-please starts this run for its tag) or a manual run; a push to
    # main just builds and tests, so merged updates reach users only when a release is cut.
    # A skipped job skips its dependents unless the condition says otherwise.
    if: >-
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      needs.preflight.result == 'success' &&
      (needs.rust-core-check.result == 'success' || needs.rust-core-check.result == 'skipped') &&
      (needs.test-desktop.result == 'success' || needs.test-desktop.result == 'skipped') &&
      (needs.test-windows-native.result == 'success' || needs.test-windows-native.result == 'skipped') &&
      needs.build-windows-exe.result == 'success' &&
      (needs.build-android-apk.result == 'success' || (inputs.reuse_android_run && needs.build-android-apk.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    cache-mode: none
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Parchment-Android-APK
          path: release-assets
          run-id: ${{ inputs.reuse_android_run || github.run_id }}
          github-token: ${{ inputs.reuse_android_run && github.token || '' }}

      - name: Download Windows EXE Installer Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Parchment-Windows-EXE-Installer
          path: release-assets

      - name: Download Release SBOM Artifact
        if: needs.release-sbom.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Parchment-SBOM
          path: release-assets

      # release-please already wrote the notes from the commits; this adds the signing note and how to check a
      # download. SHA256SUMS.txt lets anyone check one.
      - name: Prepare Release Notes and Checksums
        run: |
          {
            echo
            echo "Android releases use a private signing identity. Legacy installations signed with the exposed repository key require an explicit backup/export and migration before installation."
            echo "See the [release-signing and migration guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/release-signing.md). Installs already using the private identity can update normally."
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS.txt\` (or \`Get-FileHash\` on Windows)."
          } >> notes.md
          (cd release-assets && sha256sum Parchment-* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create or Update GitHub Release for In-App OTA Updater
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          name: ${{ needs.preflight.outputs.release_tag }}
          body_path: notes.md
          append_body: true
          files: |
            release-assets/Parchment-Android-Universal.apk
            release-assets/Parchment-Android-R8-mapping.txt
            release-assets/Parchment-SBOM.cdx.json
            release-assets/Parchment-Windows-x64-Setup.exe
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: false
