name: Build Android APK & Windows EXE Installer

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "CHANGELOG.md"
      - ".release-please-manifest.json"
      - "release-please-config.json"
  workflow_dispatch:
    inputs:
      reuse_android_run:
        description: "Windows only: ID of the run whose APK to reuse. The release keeps that run's version. Leave empty for a full build."
        required: false
        default: ""

permissions:
  contents: read

# Cancel superseded branch and PR builds immediately, while never cancelling version-tag or manual release runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'ci' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}

# Branch builds are VERSION_LINE.<run number - VERSION_BASE_RUN>: run 73 is 2.1.0, run 74 is 2.1.1.
# Earlier runs keep 2.0.<run number>, so a Windows-only rebuild reusing one still matches its APK.
# The Android version code stays 200 + run number, so it only ever grows.
env:
  VERSION_LINE: "2.1"
  VERSION_BASE_RUN: "73"

jobs:
  preflight:
    name: Preflight Gates & Path Filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      build_number: ${{ steps.plan.outputs.build_number }}
      app_version: ${{ steps.plan.outputs.app_version }}
      app_version_code: ${{ steps.plan.outputs.app_version_code }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      desktop_tests: ${{ steps.plan.outputs.desktop_tests }}
      windows_tests: ${{ steps.plan.outputs.windows_tests }}
      android: ${{ steps.plan.outputs.android }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Run Quality Gates, Tool Tests, and Resolve Affected Jobs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          REUSE_ANDROID_RUN: ${{ inputs.reuse_android_run }}
        run: |
          set -euo pipefail
          python3 scripts/quality.py &
          PID_Q=$!
          git -c core.safecrlf=false diff --check &
          PID_D=$!
          python3 -I -X utf8 scripts/test_workflow_tools.py &
          PID_W=$!
          PYTHONPATH=.github/scripts python3 -m unittest \
            test_run_gradle \
            test_check_sbom \
            test_shard_tests \
            test_ci_changes &
          PID_U=$!
          python3 .github/scripts/ci_changes.py installers
          if grep -q '^signing_scripts=true$' "$GITHUB_OUTPUT"; then
            PYTHONPATH=.github/scripts python3 .github/scripts/test_stage_android_signing.py &
          else
            PYTHONPATH=.github/scripts python3 -m unittest test_stage_android_signing -k PrivateSignerTest &
          fi
          PID_S=$!
          wait "$PID_Q" "$PID_D" "$PID_W" "$PID_U" "$PID_S"

  test-desktop:
    name: Desktop Tests (Shard ${{ matrix.label }})
    needs: preflight
    if: needs.preflight.outputs.desktop_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - shard: 0
            label: "1/2"
          - shard: 1
            label: "2/2"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Desktop Test Shard
        run: |
          chmod +x ./gradlew
          read -r -a SHARD_ARGS <<< "$(python3 .github/scripts/shard_tests.py --index "${{ matrix.shard }}" --total 2)"
          python3 .github/scripts/run_gradle.py -- :composeApp:desktopTest "${SHARD_ARGS[@]}" \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pparchment.testForks=3 \
            --no-daemon --no-configuration-cache --max-workers=4 \
            -Pkotlin.compiler.execution.strategy=in-process

  test-windows-native:
    name: Windows Native Tests
    needs: preflight
    if: needs.preflight.outputs.windows_tests == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Windows Native Test Suites
        shell: pwsh
        env:
          GRADLE_OPTS: "-Xmx5g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          $gradleHome = if ($env:GRADLE_USER_HOME) { $env:GRADLE_USER_HOME } else { "$HOME\.gradle" }
          New-Item -ItemType Directory -Force -Path $gradleHome | Out-Null
          Add-Content -Path "$gradleHome\gradle.properties" -Value "`norg.gradle.jvmargs=-Xmx5g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          $winTests = (python .github/scripts/shard_tests.py --windows-native) -split ' '
          python .github/scripts/run_gradle.py -- :composeApp:desktopTest @winTests `
            -Pparchment.testForks=2 `
            --no-daemon --no-configuration-cache --max-workers=4 '-Pkotlin.compiler.execution.strategy=in-process'
          exit $LASTEXITCODE

  build-android-apk:
    name: Build Android .APK (Universal)
    needs: preflight
    if: needs.preflight.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Restore Android Platform 37 Cache
        id: cache-android-platform
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/platforms/android-37*
          key: android-platform-37-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Restore Android Build-Tools 37 Cache
        id: cache-android-bt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/build-tools/37*
          key: android-build-tools-37-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Write Android SDK License Hashes
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Stage Private Release Signer
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/stage_android_signing.py

      - name: Build Android APK
        env:
          APP_VER: ${{ needs.preflight.outputs.app_version }}
          APP_CODE: ${{ needs.preflight.outputs.app_version_code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            BUILD_VARIANT=debug
            BUILD_TASK=:androidApp:assembleDebug
            EXTRA_FLAGS=(-PofficialRelease=false)
          else
            BUILD_VARIANT=release
            BUILD_TASK=:androidApp:assembleRelease
            EXTRA_FLAGS=(-PofficialRelease=true -x :androidApp:lintVitalRelease)
          fi
          echo "ANDROID_BUILD_VARIANT=$BUILD_VARIANT" >> "$GITHUB_ENV"
          chmod +x ./gradlew
          python3 .github/scripts/run_gradle.py -- "$BUILD_TASK" \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -PappVersion="$APP_VER" \
            -PappVersionCode="$APP_CODE" \
            -PgithubRepo="$GITHUB_REPOSITORY" \
            "${EXTRA_FLAGS[@]}" \
            --no-daemon --no-configuration-cache --max-workers=4 -Pkotlin.compiler.execution.strategy=in-process

      - name: Rename APK for Clean Download
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/"$ANDROID_BUILD_VARIANT"/*.apk dist/Parchment-Android-Universal.apk
          # R8 renames classes, so a release's crash reports can only be read with its own mapping file.
          if [[ "$ANDROID_BUILD_VARIANT" == release ]]; then
            cp androidApp/build/outputs/mapping/release/mapping.txt dist/Parchment-Android-R8-mapping.txt
          fi

      - name: Save Android Platform 37 Cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache-android-platform.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/platforms/android-37*
          key: android-platform-37-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Save Android Build-Tools 37 Cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache-android-bt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/build-tools/37*
          key: android-build-tools-37-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Verify Staged APK Exists
        run: test -s dist/Parchment-Android-Universal.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Parchment-Android-APK
          path: dist/Parchment-*
          compression-level: 1
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          if-no-files-found: error

      - name: Remove Staged Private Signer
        if: always() && github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get('ANDROID_KEYSTORE_PATH')
          if value:
              target = Path(value).resolve()
              target.relative_to(Path(os.environ['RUNNER_TEMP']).resolve())
              if not target.parent.name.startswith('parchment-signing-'):
                  raise ValueError('Unexpected signer staging directory')
              target.unlink(missing_ok=True)
              target.parent.rmdir()
          PY

  build-windows-exe:
    name: Build Windows .EXE Installer (Zero-Trace Uninstall & Silent OTA)
    needs: preflight
    if: needs.preflight.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build Windows Packaged Runtime (ProGuard + Leyden AOT)
        shell: pwsh
        env:
          APP_VER: ${{ needs.preflight.outputs.app_version }}
          APP_CODE: ${{ needs.preflight.outputs.app_version_code }}
          OFFICIAL_RELEASE: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          GRADLE_OPTS: "-Xmx5g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          $gradleHome = if ($env:GRADLE_USER_HOME) { $env:GRADLE_USER_HOME } else { "$HOME\.gradle" }
          New-Item -ItemType Directory -Force -Path $gradleHome | Out-Null
          Add-Content -Path "$gradleHome\gradle.properties" -Value "`norg.gradle.jvmargs=-Xmx5g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          python .github/scripts/run_gradle.py -- :composeApp:createReleaseDistributable `
            "-PappVersion=$env:APP_VER" `
            "-PappVersionCode=$env:APP_CODE" `
            "-PgithubRepo=$env:GITHUB_REPOSITORY" `
            "-PofficialRelease=$env:OFFICIAL_RELEASE" `
            --no-daemon --no-configuration-cache --max-workers=4 '-Pkotlin.compiler.execution.strategy=in-process'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys; sys.path.insert(0, 'scripts'); import verify; m = verify.missing_service_classes(); sys.exit('\n'.join(m) if m else 0)"
          exit $LASTEXITCODE

      - name: Package Minimal Zero-Trace .EXE Installer with Inno Setup
        shell: pwsh
        env:
          APP_VER: ${{ needs.preflight.outputs.app_version }}
          INNO_COMPRESSION: ${{ github.event_name == 'pull_request' && 'lzma2/fast' || 'lzma2/max' }}
        run: iscc.exe "/DMyAppVersion=$env:APP_VER" "/DMyCompression=$env:INNO_COMPRESSION" installer\windows-installer.iss

      - name: Verify Installed .EXE Maps Leyden AOT Cache Across Timezones
        shell: pwsh
        run: |
          $origTz = (Get-TimeZone).Id
          $testDir = Join-Path ([System.IO.Path]::GetTempPath()) "parchment-inno-aot-check"
          Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          try {
            tzutil /s "SE Asia Standard Time"
            $proc = Start-Process -FilePath "build\installer\Parchment-Windows-x64-Setup.exe" `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$testDir" `
              -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Silent installer exited with $($proc.ExitCode)" }
            $env:JAVA_TOOL_OPTIONS = "-Xlog:aot*=info"
            $out = & "$testDir\Parchment.exe" --aot-verify 2>&1 | Out-String
            Remove-Item Env:JAVA_TOOL_OPTIONS -ErrorAction SilentlyContinue
            if ($LASTEXITCODE -ne 0 -or $out -notmatch "Using AOT-linked classes: true" -or $out -match "Unable to map shared spaces") {
              throw "Installed Parchment.exe rejected parchment.aot:`n$out"
            }
          } finally {
            tzutil /s $origTz
            Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          }

      - name: Upload Windows EXE Installer Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Parchment-Windows-EXE-Installer
          path: build/installer/Parchment-Windows-x64-Setup.exe
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          if-no-files-found: error

  release-sbom:
    name: Generate Release SBOM
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Restore Android Platform 37 Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/platforms/android-37*
          key: android-platform-37-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Write Android SDK License Hashes
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Generate and Validate SBOM
        run: |
          chmod +x ./gradlew
          ./gradlew --init-script .github/scripts/sbom.init.gradle.kts cyclonedxBom \
            --no-daemon --no-configuration-cache --no-build-cache --max-workers=4 -PappVersion=1.0.0
          python3 .github/scripts/check_sbom.py build/reports/cyclonedx/bom.json
          mkdir -p dist
          cp build/reports/cyclonedx/bom.json dist/Parchment-SBOM.cdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Parchment-SBOM
          path: dist/Parchment-SBOM.cdx.json
          compression-level: 1
          retention-days: 30
          if-no-files-found: error

  publish-github-release:
    name: Publish OTA Release Assets (.APK & .EXE)
    needs: [preflight, test-desktop, test-windows-native, build-android-apk, build-windows-exe, release-sbom]
    # Releases come only from version tags (release-please starts this run for its tag) or a manual run; a push to
    # main just builds and tests, so merged updates reach users only when a release is cut.
    # A skipped job skips its dependents unless the condition says otherwise.
    if: >-
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      needs.preflight.result == 'success' &&
      needs.test-desktop.result == 'success' &&
      (needs.test-windows-native.result == 'success' || needs.test-windows-native.result == 'skipped') &&
      needs.build-windows-exe.result == 'success' &&
      (needs.build-android-apk.result == 'success' || (inputs.reuse_android_run && needs.build-android-apk.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Parchment-Android-APK
          path: release-assets
          run-id: ${{ inputs.reuse_android_run || github.run_id }}
          github-token: ${{ inputs.reuse_android_run && github.token || '' }}

      - name: Download Windows EXE Installer Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Parchment-Windows-EXE-Installer
          path: release-assets

      - name: Download Release SBOM Artifact
        if: needs.release-sbom.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Parchment-SBOM
          path: release-assets

      # release-please already wrote the notes from the commits; this adds the signing note and how to check a
      # download. SHA256SUMS.txt lets anyone check one.
      - name: Prepare Release Notes and Checksums
        run: |
          {
            echo
            echo "Android releases use a private signing identity. Legacy installations signed with the exposed repository key require an explicit backup/export and migration before installation."
            echo "See the [release-signing and migration guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/RELEASE_SIGNING.md). Installs already using the private identity can update normally."
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS.txt\` (or \`Get-FileHash\` on Windows)."
          } >> notes.md
          (cd release-assets && sha256sum Parchment-* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create or Update GitHub Release for In-App OTA Updater
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          name: ${{ needs.preflight.outputs.release_tag }}
          body_path: notes.md
          append_body: true
          files: |
            release-assets/Parchment-Android-Universal.apk
            release-assets/Parchment-Android-R8-mapping.txt
            release-assets/Parchment-SBOM.cdx.json
            release-assets/Parchment-Windows-x64-Setup.exe
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: false
