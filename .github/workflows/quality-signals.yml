name: Quality signals

# For pull requests: test coverage (Kover), the rendered UI gallery (uploaded so a reviewer can compare the
# screens with the previous run's) and a check that the release SBOM lists the app's libraries.
# Runs on GitHub's machines; nothing here gates a release.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Quality Targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      coverage: ${{ steps.filter.outputs.coverage }}
      sbom: ${{ steps.filter.outputs.sbom }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Classify Affected Signals
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: python3 .github/scripts/ci_changes.py quality-signals

  coverage-and-gallery:
    name: Coverage and UI gallery
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      # Runs every desktop test once, instrumented, with the gallery rendering turned on.
      - name: Tests with Coverage
        run: |
          chmod +x ./gradlew
          python3 .github/scripts/run_gradle.py -- --init-script .github/scripts/kover.init.gradle.kts \
            :composeApp:koverXmlReport :composeApp:koverHtmlReport :composeApp:koverLog \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pparchment.gallery=true --no-daemon --no-configuration-cache --max-workers=4 \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Upload Coverage Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: composeApp/build/reports/kover/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload UI Gallery
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-gallery
          path: .parchment-local/verification/gallery/*.png
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

  sbom:
    name: SBOM Verification
    needs: changes
    if: needs.changes.outputs.sbom == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Cache Android SDK Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/licenses
            /usr/local/lib/android/sdk/platforms/android-37*
            /usr/local/lib/android/sdk/build-tools/35*
            /usr/local/lib/android/sdk/build-tools/36*
            /usr/local/lib/android/sdk/build-tools/37*
          key: android-sdk-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Accept Android SDK Licenses
        run: |
          if [ ! -f "$ANDROID_HOME/licenses/.parchment-accepted" ]; then
            SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
            if [ -n "$SDKMGR" ]; then
              yes | "$SDKMGR" --licenses > /dev/null || true
              mkdir -p "$ANDROID_HOME/licenses"
              touch "$ANDROID_HOME/licenses/.parchment-accepted"
            fi
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      # The release attaches this SBOM; checking it here catches a scan that lists no libraries before a release does.
      - name: Generate and Validate SBOM
        run: |
          chmod +x ./gradlew
          python3 .github/scripts/run_gradle.py -- --init-script .github/scripts/sbom.init.gradle.kts cyclonedxBom \
            --no-daemon --no-configuration-cache --no-build-cache --max-workers=4 -PappVersion=1.0.0
          PYTHONPATH=.github/scripts python3 .github/scripts/test_check_sbom.py
          python3 .github/scripts/check_sbom.py build/reports/cyclonedx/bom.json

      - name: Upload SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: build/reports/cyclonedx/bom.json
          retention-days: 14
          if-no-files-found: warn
