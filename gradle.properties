# Gradle & Kotlin Multiplatform settings
# Each build is one short batch job (no daemon): the parallel collector costs less CPU than G1 plus string deduplication.
org.gradle.jvmargs=-Xmx2560m -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin Multiplatform
kotlin.code.style=official
kotlin.parallel.tasks.in.project=true
# Windows releases ship native Rust GPUI (crates/parchment-desktop) + Inno Setup, never WiX MSI/EXE.
compose.desktop.application.downloadWix=false

# AndroidX & R8 Full Mode (non-transitive R classes are AGP 9's default)
android.useAndroidX=true
android.enableR8.fullMode=true
